  </defs>
  <!-- wings -->
  <g fill="#FFFFFF" fill-opacity="0.85" stroke="#8E6F3E" stroke-width="1">
    <ellipse cx="10.5" cy="15" rx="5.8" ry="3.2" transform="rotate(-32 10.5 15)" />
    <ellipse cx="21.5" cy="15" rx="5.8" ry="3.2" transform="rotate(32 21.5 15)" />
